[project]
name = "pytorch_tabnet"
version = "5.0.0"
description = "PyTorch implementation of TabNet"
readme = "README.md"
authors = []
urls = {homepage = "https://github.com/dreamquark-ai/tabnet", repository = "https://github.com/dreamquark-ai/tabnet", documentation = "https://github.com/dreamquark-ai/tabnet"}
keywords = ["tabnet", "pytorch", "neural-networks"]
requires-python = ">=3.7"

dependencies = [
    "numpy==1.24.3",
    "torch==2.1.0",
    "tqdm>=4.65.0,<5.0.0",
    "scikit_learn==1.3.0",
    "scipy==1.11.3",
    "fsspec>=2023.1.0,<=2024.3.1",
    "filelock<3.12",
    "pyarrow>=12.0.1",
    "azure-core>=1.23.1,<2.0.0",
    "huggingface-hub>=0.21.2",
    "datasets>=2.19.1",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.1.0",
    "xgboost>=2.1.3",
    "matplotlib>=3.10.0",
    "wget>=3.2",
    "pandas==2.0.3",
    "flake8>=3.7.9",
    "sphinx>=2.2",
    "sphinx-rtd-theme>=0.5.0",
    "recommonmark>=0.6.0",
    "pytest>=6.2.5",
    "seaborn>=0.13.0",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"