[project]
name = "pytorch_tabnet"
version = "4.0.0"
description = "PyTorch implementation of TabNet with Spark support"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1.0",  # For Apple Silicon GPU support
    "numpy>=1.19.0,<2.0.0",
    "scipy>=1.5.0",
    "pandas>=1.0.0",
    "scikit-learn>=0.24.0",
    "pyspark>=3.0.0",
    "petastorm>=0.11.0",
    "pyarrow<12.0.0",
    "typing-extensions>=4.0.0",
    "polars>=1.21.0"
]

[build-system]
requires = ["pdm-backend>=1.0.0"]
build-backend = "pdm.backend"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
allow_subclassing_any = false
strict_optional = true
disable_error_code = []
implicit_reexport = false
allow_redefinition = false

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "numpy.*",
    "scipy.*",
    "pyspark.*",
    "petastorm.*",
    "pytest.*",
    "sklearn.*",
    "pytorch_tabnet.tab_network"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')"
]
testpaths = ["tests"]
python_files = ["test_*.py"]
#addopts = "-v --cov=pytorch_tabnet --cov-report=term-missing"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyx?$'

[tool.isort]
profile = "black"
multi-line_output = 3

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy>=1.0.0",
    "pytest",
    "build",
    "pandas-stubs",
    "types-setuptools",
    "tomli>=2.0.0",
    "coverage"
]
