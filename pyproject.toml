[build-system]
requires = ["setuptools", "wheel", "versioneer[toml]"]
build-backend = "setuptools.build_meta"

[project]
name = "cg_ml"
dynamic = ["version"]
description = "Custom machine learning models and Spark transformers"
authors = [{name = "Connells Group Data Platform Team", email = "connellsdataplatform@connellsgroup.co.uk"}]
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "pyspark",
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "skrub",
    "torch",
    "transformers",
    "sentence-transformers",
    "mlflow",
    "pandera",
    "scipy",
    "imbalanced_learn",
    "beautifulsoup4",
    "types-beautifulsoup4",
    "huggingface-hub",
    "pytorch-tabnet",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-spark",
    "pytest-xdist",
    "pytest-mock",
    "ruff",
    "mypy",
    "pre-commit",
    "pip-tools",
    "tox",
    "gitpython",
    "pandas-stubs",
    "types-requests",
    "types-setuptools",
    "seaborn",
    "sdv",
    "psutil",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning:pyspark.*:",
    "ignore::DeprecationWarning:pandas.*:"
]

[tool.ruff]
# Line length matches black's default
line-length = 88
indent-width = 4
# Same as Black.
target-version = "py311"

[tool.ruff.lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["E", "F"]
ignore = []

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
strict = false
install_types = true
non_interactive = true
ignore_missing_imports = true
check_untyped_defs = true
exclude = [
    "src/cg_ml/_version\\.py$"  # Ignore versioneer-generated file
]

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "src/cg_ml/_version.py"
versionfile_build = "cg_ml/_version.py"
tag_prefix = "v"
parentdir_prefix = "cg_ml-"
lookback = 200
