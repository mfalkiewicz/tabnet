[project]
name = "pytorch_tabnet"
version = "5.1.4"
description = "PyTorch implementation of TabNet"
readme = "README.md"
authors = []
urls = {homepage = "https://github.com/dreamquark-ai/tabnet", repository = "https://github.com/dreamquark-ai/tabnet", documentation = "https://github.com/dreamquark-ai/tabnet"}
keywords = ["tabnet", "pytorch", "neural-networks"]
requires-python = ">=3.7"

dependencies = [
    "numpy==1.26.4",
    "torch==2.2.1",
    "tqdm>=4.65.0,<5.0.0",
    "scikit_learn==1.2.2",
    "scipy==1.11.4",
    "pandas==2.1.4",
    "pyspark>=3.5.0,<3.6.0",
    "fsspec>=2023.1.0",
    "filelock==3.11.0",
    "pyarrow==14.0.2",
    "azure-core==1.30.2",
    "huggingface-hub==0.23.1",
    "datasets==2.19.1",
    "mlflow-skinny==2.12.2",
]

[project.optional-dependencies]
dev = [
    "jupyter==7.0.8",
    "xgboost==2.0.3",
    "matplotlib==3.8.0",
    "wget>=3.2",
    "flake8==7.0.0",
    "sphinx==5.0.2",
    "sphinx-rtd-theme>=0.5.0",
    "recommonmark>=0.6.0",
    "pytest==7.4.0",
    "seaborn==0.12.2",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"