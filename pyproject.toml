[build-system]
requires = ["setuptools>=45", "wheel", "versioneer"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch_tabnet"
version = "0.1.0"
description = "PyTorch implementation of TabNet with Spark support"
requires-python = ">=3.7"
dependencies = [
    "torch>=1.8.0",
    "numpy>=1.19.0,<2.0.0",
    "scipy>=1.5.0",
    "pandas>=1.0.0",
    "scikit-learn>=0.24.0",
    "pyspark>=3.0.0",
    "petastorm>=0.11.0",
    "pyarrow<12.0.0"
]

[tool.mypy]
python_version = "3.7"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "numpy.*",
    "scipy.*",
    "pyspark.*",
    "petastorm.*",
    "pytest.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')"
]

[tool.black]
line-length = 88
target-version = ['py37']
include = '\.pyx?$'

[tool.isort]
profile = "black"
multi-line_output = 3
